name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    name: TypeScript typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install
      - name: Typecheck against real DSH types
        run: pnpm exec tsc --noEmit

  python-smoke:
    name: Python engine smoke tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install helper dependencies
        # core/__init__ imports llm_client, which requires httpx/openai at import time
        run: pip install typer pydantic httpx openai python-dotenv
      - name: Run extract / inspect / assemble smoke tests
        run: python -m unittest discover -s test -v
